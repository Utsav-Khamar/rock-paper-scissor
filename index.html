<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="flex-item heading">
        <h1>Rock, Paper, Scissors</h1>
    </div>

    <div class="flex-item main-1">
        <div class="table">
            <div class="table-heading">
                <span>You</span>
                <span>vs</span>
                <span>Computer</span>
            </div>
            <div class="score">
                <div class="human">0</div>
                <div class="computer">0</div>
            </div>
            <div class="table-body">
                <span class="image">
                    <img src="assets/question-mark.png" alt="" class="player-move">
                </span>
                <span class="text">
                    -
                </span>
                <span>
                    <img src="assets/question-mark.png" alt="" class="computer-move">
                </span>

            </div>
        </div>
    </div>

    <div class="flex-item main-2">
        <div class="choices">
            <button class="game-btn"><img src="assets/Rock.png" alt="" id="rock"></button>
            <button class="game-btn"><img src="assets/Paper.png" alt="" id="paper"></button>
            <button class="game-btn"><img src="assets/Scissors.png" alt="" id="scissors"></button>
            <!-- <a href=""></a>
            <a href=""></a>
            <a href=""></a> -->
        </div>
    </div>

    <div class="flex-item main-3">
        <div class="display">
            <div class="dialogue">Click on any icon to start the game.</div>
        </div>
    </div>


    <script src="script.js"></script>

</body>

</html>
